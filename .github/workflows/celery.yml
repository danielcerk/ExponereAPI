name: Celery

on:
  push:
    branches:
      - main
      - dev

  schedule:

     - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:

      DJANGO_SETTINGS_MODULE: core.settings

      SECRET_KEY: ${{ secrets.SECRET_KEY }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      GOOGLE_TYPE: ${{ secrets.GOOGLE_TYPE }}
      GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
      GOOGLE_PRIVATE_KEY_ID: ${{ secrets.GOOGLE_PRIVATE_KEY_ID }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_AUTH_URI: ${{ secrets.GOOGLE_AUTH_URI }}
      GOOGLE_TOKEN_URI: ${{ secrets.GOOGLE_TOKEN_URI }}
      GOOGLE_AUTH_PROVIDER_CERT_URL: ${{ secrets.GOOGLE_AUTH_PROVIDER_CERT_URL }}
      GOOGLE_CLIENT_CERT_URL: ${{ secrets.GOOGLE_CLIENT_CERT_URL }}

      APIFY_API_KEY_5: ${{ secrets.APIFY_API_KEY_5 }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
      APIFY_API_KEY_4: ${{ secrets.APIFY_API_KEY_4 }}
      APIFY_API_KEY_3: ${{ secrets.APIFY_API_KEY_3 }}
      
      TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}

      CELERY_BROKER_URL_PROD: ${{ secrets.CELERY_BROKER_URL_PROD }}
      CELERY_RESULT_BACKEND_PROD: ${{ secrets.CELERY_RESULT_BACKEND_PROD }}

      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Celery por 6 horas
        run: |
          timeout 6h python -m celery -A core worker -B -l info -P solo