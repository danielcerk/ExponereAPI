services:

  backend:
    build: .
    container_name: exponere_backend
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8000"

    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    networks:
      - exponere

  celery:
    build: .
    container_name: exponere_celery

    command: celery -A core worker -l info

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - exponere

  celery_beat:
    build: .
    container_name: exponere_celery_beat

    command: celery -A core beat -l info

    env_file:
      - .env

    restart: unless-stopped

    networks:
      - exponere

  nginx:
    image: nginx:alpine
    container_name: exponere_nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    depends_on:
      - backend

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    networks:
      - exponere

volumes:
  static_volume:
  media_volume:

networks:
  exponere: